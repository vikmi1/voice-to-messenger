# Прод-стек voiceapp: один контейнер приложения, подключённый к сети Caddy
# (briefgenerator_internal). Порты наружу НЕ публикуются — только через Caddy.
#
# ⚠️ Имя сервиса 'voiceapp' обязано отличаться от 'app' и 'app-staging':
# в общей docker-сети алиас вешается по ИМЕНИ СЕРВИСА, и коллизия увела бы
# часть чужих запросов не туда (briefgenerator это уже ловил 21.07).
services:
  voiceapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceapp
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - voiceapp_data:/app/data      # SQLite-конфиг переживает пересборку
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  # Сеть проекта briefgenerator — там Caddy держит 80/443. voiceapp виден ему
  # по имени контейнера. Имя сети = <папка>_<сеть>; при переименовании поправить.
  proxy:
    external: true
    name: briefgenerator_internal

volumes:
  voiceapp_data:
